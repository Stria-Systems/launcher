<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stria Launcher</title>
  <style>
    :root {
      --bg: #0a120d;
      --bg-grad: linear-gradient(160deg, #0a120d 0%, #08100b 60%, #0c1610 100%);
      --card: rgba(18, 30, 22, 0.72);
      --border: rgba(126, 232, 176, 0.16);
      --border-bright: rgba(126, 232, 176, 0.5);
      --mint: #7ee8b0;
      --mint-bright: #93f0c2;
      --text: #e8f4ec;
      --text-dim: rgba(232, 244, 236, 0.64);
      --text-faint: rgba(232, 244, 236, 0.4);
      --error: #f0a0a0;
      --warn: #f0b060;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--sans);
      background: var(--bg-grad);
      color: var(--text);
      display: flex;
      align-items: stretch;
      justify-content: center;
    }
    .card {
      flex: 1;
      width: 100%;
      height: 100%;
      max-width: 720px;
      border: 1px solid var(--border);
      border-radius: 0;
      background: var(--card);
      padding: clamp(20px, 5vw, 48px) clamp(16px, 4vw, 40px);
      box-shadow: 0 24px 56px -32px rgba(0, 0, 0, 0.6);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .eyebrow {
      color: var(--mint);
      font-size: clamp(9px, 1.8vw, 11px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: clamp(4px, 1vw, 8px);
    }
    h1 {
      font-size: clamp(17px, 3.5vw, 24px);
      font-weight: 600;
      margin-bottom: clamp(4px, 0.8vw, 6px);
      color: #f2f9f4;
    }
    h2 {
      font-size: clamp(13px, 2.5vw, 16px);
      font-weight: 600;
      margin-bottom: clamp(3px, 0.6vw, 6px);
      color: #f2f9f4;
    }
    .sub {
      color: var(--text-dim);
      font-size: clamp(11px, 2.2vw, 14px);
      line-height: 1.55;
      margin-bottom: clamp(12px, 2.5vw, 20px);
    }
    .sub-faint { color: var(--text-faint); font-size: clamp(10px, 1.8vw, 12px); line-height: 1.5; }
    label {
      display: block;
      font-size: clamp(10px, 1.8vw, 12px);
      color: rgba(232,244,236,0.7);
      margin: clamp(8px, 1.5vw, 12px) 0 clamp(2px, 0.5vw, 4px);
    }
    input {
      width: 100%;
      background: rgba(5, 11, 7, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #f2f9f4;
      font-size: clamp(12px, 2.2vw, 14px);
      padding: clamp(8px, 1.5vw, 12px) clamp(10px, 1.8vw, 14px);
      outline: none;
      font-family: var(--sans);
    }
    input:focus { border-color: var(--border-bright); }
    button {
      width: 100%;
      margin-top: clamp(10px, 2vw, 16px);
      background: var(--mint);
      border: none;
      border-radius: 10px;
      color: #06130b;
      font-size: clamp(12px, 2.2vw, 14px);
      font-weight: 600;
      padding: clamp(9px, 1.8vw, 13px);
      cursor: pointer;
      font-family: var(--sans);
    }
    button:hover { background: var(--mint-bright); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid rgba(126, 232, 176, 0.3);
      color: var(--mint);
    }
    button.secondary:hover { background: rgba(126, 232, 176, 0.08); }
    .status {
      margin-top: clamp(8px, 1.5vw, 12px);
      font-size: clamp(10px, 2vw, 13px);
      color: var(--mint);
      min-height: clamp(14px, 2.5vw, 18px);
    }
    .status.err { color: var(--error); }
    .status.warn { color: var(--warn); }
    .pairing {
      margin-top: clamp(12px, 2.5vw, 20px);
      border-top: 1px solid rgba(126,232,176,0.1);
      padding-top: clamp(10px, 2vw, 16px);
    }
    code {
      font-family: var(--mono);
      font-size: clamp(12px, 2.2vw, 14px);
      letter-spacing: 0.08em;
      color: var(--mint);
    }
    /* Software hub */
    #hub { display: none; }
    .pkg {
      border: 1px solid rgba(126, 232, 176, 0.12);
      border-radius: 12px;
      padding: clamp(10px, 2vw, 16px);
      margin-bottom: clamp(6px, 1.2vw, 10px);
      background: rgba(126, 232, 176, 0.02);
    }
    .pkg-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: clamp(2px, 0.5vw, 4px);
      gap: 8px;
    }
    .pkg-name { font-weight: 600; font-size: clamp(12px, 2.2vw, 14px); }
    .pkg-desc { font-size: clamp(10px, 1.8vw, 12px); color: var(--text-faint); margin-bottom: clamp(4px, 1vw, 8px); }
    .pkg-status {
      font-size: clamp(8px, 1.5vw, 10px);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pkg-status.installed { background: rgba(126,232,176,0.15); color: var(--mint); }
    .pkg-status.available { background: rgba(255,180,80,0.15); color: var(--warn); }
    .pkg-status.pending { background: rgba(126,232,176,0.08); color: var(--text-faint); }
    .pkg-meta {
      font-size: clamp(9px, 1.6vw, 11px);
      color: var(--text-faint);
      font-family: var(--mono);
      margin-bottom: clamp(4px, 1vw, 8px);
    }
    .pkg button { margin-top: 0; font-size: clamp(11px, 2vw, 13px); padding: clamp(6px, 1.2vw, 10px); }
    .pkg-actions { display: flex; gap: clamp(4px, 0.8vw, 8px); margin-top: clamp(4px, 1vw, 8px); }
    .pkg-actions button { flex: 1; }
    .progress {
      margin-top: clamp(4px, 1vw, 8px);
      height: clamp(2px, 0.4vw, 4px);
      background: rgba(126,232,176,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar { height: 100%; background: var(--mint); width: 0%; transition: width 0.3s; }
    .hub-actions {
      display: flex;
      gap: clamp(6px, 1.2vw, 10px);
      margin-top: clamp(10px, 2vw, 16px);
    }
    .hub-actions button { margin-top: 0; }
    .empty-state { text-align: center; padding: clamp(12px, 3vw, 24px) 0; }
    .empty-state .icon { font-size: clamp(20px, 4vw, 32px); margin-bottom: clamp(4px, 1vw, 8px); }
    .empty-state .title { font-weight: 600; font-size: clamp(12px, 2.2vw, 14px); margin-bottom: clamp(2px, 0.5vw, 4px); }
    .empty-state .desc { font-size: clamp(10px, 1.8vw, 12px); color: var(--text-faint); }
    /* Auth tabs */
    .auth-tabs {
      display: flex;
      gap: clamp(4px, 0.8vw, 8px);
      margin-bottom: clamp(12px, 2.5vw, 20px);
      border-bottom: 1px solid rgba(126, 232, 176, 0.12);
      padding-bottom: clamp(4px, 0.8vw, 8px);
    }
    .auth-tab {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: clamp(11px, 2vw, 13px);
      font-weight: 500;
      padding: clamp(6px, 1.2vw, 10px) clamp(10px, 2vw, 16px);
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      width: auto;
      margin: 0;
      flex: 1;
      text-align: center;
      transition: color 0.15s, background 0.15s;
    }
    .auth-tab:hover {
      color: var(--text);
      background: rgba(126, 232, 176, 0.04);
    }
    .auth-tab.active {
      color: var(--mint);
      background: rgba(126, 232, 176, 0.08);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Registration + pairing view -->
  <div class="card" id="setup">
    <p class="eyebrow">Stria Launcher</p>
    <h1 id="auth-title">Set up your workspace.</h1>
    <p class="sub" id="auth-sub">
      The launcher installs and updates all Stria software on this machine —
      Stria Works, Stria-Pi, and the Kestrel runtime. Your objectives, evidence,
      and costs sync to portal.striasystems.com.
    </p>

    <!-- Tab toggle -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-create">Create workspace</button>
      <button class="auth-tab" id="tab-signin">Sign in</button>
    </div>

    <!-- Create workspace form -->
    <form id="reg">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="email" required />
      <label for="org">Organization name</label>
      <input id="org" type="text" autocomplete="organization" required />
      <label for="pass">Password (10+ characters)</label>
      <input id="pass" type="password" autocomplete="new-password" minlength="10" required />
      <button type="submit" id="submit">Create workspace</button>
    </form>

    <!-- Sign in form (hidden by default) -->
    <form id="signin-form" style="display:none">
      <label for="login-email">Work email</label>
      <input id="login-email" type="email" autocomplete="email" required />
      <label for="login-pass">Password</label>
      <input id="login-pass" type="password" autocomplete="current-password" required />
      <button type="submit" id="login-submit">Sign in</button>
    </form>

    <div class="pairing">
      <label for="code">Pairing code from the portal (AAA-BBB-CCC)</label>
      <input id="code" type="text" autocomplete="off" placeholder="AAA-BBB-CCC" />
      <p class="status" id="status"></p>
    </div>
  </div>

  <!-- Software hub view (shown after pairing) -->
  <div class="card" id="hub">
    <p class="eyebrow">Stria Software Hub</p>
    <h1 id="hub-title">Your software.</h1>
    <p class="sub" id="hub-sub">Checking for updates…</p>
    <div id="pkg-list"></div>
    <div class="hub-actions">
      <button class="secondary" id="check-btn">Check for updates</button>
      <button id="install-all-btn" style="display:none">Install all</button>
    </div>
    <p class="status" id="hub-status"></p>
  </div>

  <script>
    const status = (msg, err) => {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = "status" + (err ? " err" : "");
    };
    const hubStatus = (msg, kind) => {
      const el = document.getElementById("hub-status");
      el.textContent = msg;
      el.className = "status" + (kind === "err" ? " err" : kind === "warn" ? " warn" : "");
    };
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    // Auto-paired: if ~/.stria/portal.json exists, skip to hub
    (async () => {
      try {
        await window.__TAURI__.core.invoke("fetch_software_updates");
        document.getElementById("setup").style.display = "none";
        document.getElementById("hub").style.display = "block";
        await loadHub();
      } catch {
        // Not paired — show setup
      }
    })();

    // Tab switching
    document.getElementById("tab-create").addEventListener("click", () => {
      document.getElementById("tab-create").classList.add("active");
      document.getElementById("tab-signin").classList.remove("active");
      document.getElementById("reg").style.display = "block";
      document.getElementById("signin-form").style.display = "none";
      document.getElementById("auth-title").textContent = "Set up your workspace.";
      status("");
    });
    document.getElementById("tab-signin").addEventListener("click", () => {
      document.getElementById("tab-signin").classList.add("active");
      document.getElementById("tab-create").classList.remove("active");
      document.getElementById("reg").style.display = "none";
      document.getElementById("signin-form").style.display = "block";
      document.getElementById("auth-title").textContent = "Sign in to your workspace.";
      status("");
    });

    // Registration
    document.getElementById("reg").addEventListener("submit", async (e) => {
      e.preventDefault();
      status("Creating your workspace…");
      try {
        await window.__TAURI__.core.invoke("register_workspace", {
          email: document.getElementById("email").value,
          organization: document.getElementById("org").value,
          password: document.getElementById("pass").value,
        });
        status("Workspace created. Check your email for the verification link, then pair this machine.");
      } catch (err) {
        status(String(err), true);
      }
    });

    // Sign in
    document.getElementById("signin-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      status("Signing in…");
      try {
        await window.__TAURI__.core.invoke("sign_in", {
          email: document.getElementById("login-email").value,
          password: document.getElementById("login-pass").value,
        });
        status("Signed in. Loading software hub…");
        await sleep(500);
        document.getElementById("setup").style.display = "none";
        document.getElementById("hub").style.display = "block";
        await loadHub();
      } catch (err) {
        status(String(err), true);
      }
    });

    // Pairing
    document.getElementById("code").addEventListener("change", async (e) => {
      const code = e.target.value.trim();
      if (!/^[A-Z2-9]{3}-[A-Z2-9]{3}-[A-Z2-9]{3}$/.test(code)) return;
      status("Pairing this machine…");
      try {
        await window.__TAURI__.core.invoke("pair_machine", { pairingCode: code });
        status("Paired. Loading software hub…");
        await sleep(500);
        document.getElementById("setup").style.display = "none";
        document.getElementById("hub").style.display = "block";
        await loadHub();
      } catch (err) {
        status(String(err), true);
      }
    });

    async function loadHub() {
      hubStatus("Checking for updates…");
      try {
        const platform = await window.__TAURI__.core.invoke("platform_name");
        const arch = await window.__TAURI__.core.invoke("arch_name");
        const updateJson = await window.__TAURI__.core.invoke("fetch_software_updates");
        const data = JSON.parse(updateJson);

        const list = document.getElementById("pkg-list");
        list.innerHTML = "";

        if (!data.updates || data.updates.length === 0) {
          document.getElementById("hub-title").textContent = "Your software is up to date.";
          document.getElementById("hub-sub").textContent = data.org_id;
          list.innerHTML = `
            <div class="empty-state">
              <div class="icon">✓</div>
              <div class="title">All packages current</div>
              <div class="desc">The launcher checks for updates automatically.</div>
            </div>`;
          hubStatus("All packages up to date.");
          document.getElementById("install-all-btn").style.display = "none";
        } else {
          document.getElementById("hub-title").textContent = data.updates.length + " update available.";
          document.getElementById("hub-sub").textContent = data.org_id;
          document.getElementById("install-all-btn").style.display = "block";

          for (const u of data.updates) {
            const div = document.createElement("div");
            div.className = "pkg";
            const asset = u.assets.find(a => a.platform === platform && a.arch === arch)
                      || u.assets.find(a => a.platform === platform)
                      || u.assets[0];
            div.innerHTML = `
              <div class="pkg-head">
                <span class="pkg-name">${u.package_id}</span>
                <span class="pkg-status available">Update</span>
              </div>
              <div class="pkg-meta">${u.current_version ?? "not installed"} → ${u.target_version} · ${u.channel}</div>
              <div class="pkg-actions">
                <button class="secondary install-btn"${asset ? "" : " disabled"}>Install${asset ? " (" + formatSize(asset.size) + ")" : " (no build)"}</button>
              </div>
              <div class="progress"><div class="progress-bar"></div></div>
            `;
            list.appendChild(div);
            // Bind install
            const btn = div.querySelector(".install-btn");
            btn.addEventListener("click", async () => {
              if (!asset) { hubStatus(`No ${platform} build for ${u.package_id}`, true); return; }
              btn.textContent = "Downloading…";
              btn.disabled = true;
              try {
                const path = await window.__TAURI__.core.invoke("download_suite_asset", { url: asset.url, expectedSha256: asset.sha256 });
                btn.textContent = "Installed ✓";
                btn.style.background = "rgba(126,232,176,0.2)";
                div.querySelector(".pkg-status").className = "pkg-status installed";
                div.querySelector(".pkg-status").textContent = "Installed";
                hubStatus(`Installed ${u.package_id} → ${path}`);
                // Report back to portal
                await window.__TAURI__.core.invoke("report_software_versions", {
                  packages: { [u.package_id]: u.target_version }
                }).catch(() => {});
              } catch (err) {
                btn.textContent = "Retry install";
                btn.disabled = false;
                hubStatus(`Failed: ${err}`, true);
              }
            });
          }
          hubStatus(data.updates.length + " update(s) available.");
        }

        // Report launcher version back to portal
        await window.__TAURI__.core.invoke("report_software_versions", {
          packages: {}
        }).catch(() => {});
      } catch (err) {
        hubStatus(`Could not load software hub: ${err}`, true);
      }
    }

    document.getElementById("check-btn").addEventListener("click", loadHub);
    document.getElementById("install-all-btn").addEventListener("click", async () => {
      const btns = document.querySelectorAll(".pkg-actions button");
      for (const btn of btns) {
        if (!btn.disabled && btn.textContent.includes("Install")) btn.click();
        await sleep(400);
      }
    });

    function formatSize(bytes) {
      if (!bytes) return "";
      if (bytes >= 1_000_000) return (bytes / 1_000_000).toFixed(1) + " MB";
      return Math.round(bytes / 1024) + " KB";
    }
  </script>
</body>
</html>
